name: daily-pipeline

on:
  schedule:
    - cron: "10 17 * * *"  # 매일 02:10 KST (구독 사용량이 큰 작업은 새벽 1~3시, 실거래가 채널 01:00와 겹치지 않게)
  workflow_dispatch:         # Actions 탭에서 수동 실행 (발행 수를 줄여 시험할 수 있음)
    inputs:
      max_stories:
        description: "이번 실행의 최대 글 수 (비우면 설정값)"
        required: false
        default: ""
      max_shorts:
        description: "이번 실행의 최대 숏츠 수 (비우면 설정값)"
        required: false
        default: ""
      command:
        description: "실행할 단계 (all | learn | shorts | build)"
        required: false
        default: "all"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: issue-pipeline
  cancel-in-progress: false

jobs:
  run:
    # 킬 스위치: 저장소 Settings > Variables 에서 PIPELINE_ENABLED=false 로 두면 전체 중단
    if: vars.PIPELINE_ENABLED != 'false'
    runs-on: ubuntu-latest
    outputs:
      pipeline_status: ${{ steps.pipeline.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts (Korean, color emoji) + ffmpeg for video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-color-emoji ffmpeg
          rm -rf ~/.cache/matplotlib

      - run: pip install -r requirements.txt

      # Claude는 API(종량 과금)가 아니라 Claude Code CLI + 구독 토큰으로 호출
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      - name: Tests (실패하면 발행하지 않음)
        run: python -m unittest discover -s tests

      - name: News → pick → write → review → shorts → build
        id: pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MAX_STORIES: ${{ inputs.max_stories }}
          MAX_SHORTS: ${{ inputs.max_shorts }}
          HYPERFRAMES_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set +e
          python -m pipeline.run "${{ inputs.command || 'all' }}"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo '### 실행 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/last_run.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save data (DB) back to repo
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/pipeline.db data/last_run.json
          [ -f data/playbook.json ] && git add data/playbook.json
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          # 실행 중 다른 커밋이 올라왔어도 데이터가 사라지지 않도록 재시도
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done

      - name: Keep rendered shorts (Actions > 실행 > Artifacts 에서 다운로드)
        if: hashFiles('videos/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: videos/
          retention-days: 30

      - if: (inputs.command || 'all') == 'all' || inputs.command == 'build'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    if: (inputs.command || 'all') == 'all' || inputs.command == 'build'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    # Pages 배포 후 실행: 방금 올라간 public/media/*.mp4 URL로 릴스 게시
    needs: deploy
    if: (inputs.command || 'all') == 'all'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.ig.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # run 작업이 저장한 최신 DB
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post reels
        id: ig
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_STATE_KEY: ${{ secrets.IG_STATE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set +e
          python -m pipeline.run instagram
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Save data back to repo
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/pipeline.db
          [ -f data/ig_state.enc ] && git add data/ig_state.enc
          git diff --cached --quiet && exit 0
          git commit -m "data: instagram $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done

  report:
    # 파이프라인 일부가 실패했으면 워크플로를 실패로 표시 → GitHub가 이메일로 알림
    needs: [run, deploy, instagram]
    if: always() && needs.run.result != 'skipped' && (needs.run.outputs.pipeline_status != '0' || needs.instagram.result == 'failure' || (needs.instagram.outputs.status != '' && needs.instagram.outputs.status != '0'))
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "파이프라인 오류가 있었습니다. run 작업의 Summary를 확인하세요."
          exit 1
