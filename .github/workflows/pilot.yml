name: motion-pilot

# 새 숏츠 방식(HyperFrames + 장면별 그림) 시범 렌더링. 수동 실행만, 업로드·DB 저장 없음.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "시범으로 만들 글 slug (공백으로 구분)"
        required: true
      fake_writer:
        description: "Claude 대신 가짜 장면 계획 (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts (Korean, color emoji)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-noto-color-emoji ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Render pilot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HYPERFRAMES_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          ARGS="${{ inputs.slugs }}"
          if [ "${{ inputs.fake_writer }}" = "true" ]; then ARGS="$ARGS --fake-writer"; fi
          python -m pipeline.pilot $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot
          path: |
            videos/pilot/*.mp4
            videos/pilot/*.jpg
            videos/pilot/report.json
            videos/pilot/_*/project/index.html
          retention-days: 7
